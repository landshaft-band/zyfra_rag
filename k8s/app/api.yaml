apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: rag-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-api
  template:
    metadata:
      labels:
        app: rag-api
    spec:
      containers:
        - name: api
          image: rag-local-app:k8s-dev
          imagePullPolicy: Never
          args: ["--qdrant-url", "http://qdrant:6333", "serve", "--host", "0.0.0.0"]
          envFrom:
            - configMapRef:
                name: rag-config
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: rag-postgres
                  key: password
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 30
            periodSeconds: 4
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 3Gi
          volumeMounts:
            - name: index
              mountPath: /app/data/processed
              readOnly: true
            - name: model-cache
              mountPath: /home/rag/.cache/huggingface
      volumes:
        - name: index
          persistentVolumeClaim:
            claimName: rag-index
        - name: model-cache
          persistentVolumeClaim:
            claimName: rag-e5-cache
