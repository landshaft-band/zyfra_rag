apiVersion: apps/v1
kind: Deployment
metadata:
  name: publisher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-publisher
  template:
    metadata:
      labels:
        app: rag-publisher
    spec:
      containers:
        - name: publisher
          image: rag-local-app:k8s-dev
          imagePullPolicy: Never
          args: ["queue-publisher"]
          envFrom:
            - configMapRef:
                name: rag-config
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: rag-postgres
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-dispatcher
  template:
    metadata:
      labels:
        app: rag-dispatcher
    spec:
      containers:
        - name: dispatcher
          image: rag-local-app:k8s-dev
          imagePullPolicy: Never
          args: ["queue-dispatcher"]
          envFrom:
            - configMapRef:
                name: rag-config
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
