apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-worker
  template:
    metadata:
      labels:
        app: rag-worker
    spec:
      containers:
        - name: worker
          image: rag-local-app:k8s-dev
          imagePullPolicy: Never
          args: ["--qdrant-url", "http://qdrant:6333", "queue-worker"]
          envFrom:
            - configMapRef:
                name: rag-config
            - secretRef:
                name: rag-model
                optional: true
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: rag-postgres
                  key: password
          resources:
            requests:
              cpu: "1"
              memory: 1536Mi
            limits:
              memory: 3Gi
          volumeMounts:
            - name: index
              mountPath: /app/data/processed
              readOnly: true
            - name: model-cache
              mountPath: /home/rag/.cache/huggingface
      volumes:
        - name: index
          persistentVolumeClaim:
            claimName: rag-index
        - name: model-cache
          persistentVolumeClaim:
            claimName: rag-e5-cache
