[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "landshaft-band", email = "kozlikoff2004@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "confluent-kafka>=2.12,<3",
    "fastapi>=0.165.0",
    "guardrails-ai==0.11.0",
    "psycopg[binary]>=3.3,<4",
    "qdrant-client~=1.13.3",
    "redis>=6,<9",
    "tokenizers>=0.23.3",
    "torch>=2.15.0",
    "transformers>=5.24.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
rag = "rag:main"

[project.optional-dependencies]
observability = ["langfuse>=5,<6"]
evaluation = [
    "langchain-community<0.4",
    "pillow>=13.0.0",
    "ragas==0.3.1",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
